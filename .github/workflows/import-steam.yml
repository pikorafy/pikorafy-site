name: Import Steam catalog

# Runs outside Vercel on purpose: no function time limit, and it avoids the
# 403s that CheapShark returns to Vercel's IPs. See scripts/import-steam.mts.

on:
  schedule:
    - cron: "17 * * * *"     # hourly: up to 60 games per run (new games first), ~1400/day
    - cron: "40 4 * * 1"     # Mondays: refresh the top-2000 seed list from SteamSpy
  workflow_dispatch:
    inputs:
      command:
        description: "seed | seed-ids | run | backfill-trailers | art | items"
        default: run
      arg:
        description: "topN / comma-separated IDs / maxGames / max games to backfill"
        default: ""

concurrency:
  group: import-steam
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run importer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CMD: ${{ inputs.command }}
          ARG: ${{ inputs.arg }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/import-steam.mts "$CMD" $ARG
          elif [ "${{ github.event.schedule }}" = "40 4 * * 1" ]; then
            node scripts/import-steam.mts seed 2000
          else
            node scripts/import-steam.mts run 60
          fi
