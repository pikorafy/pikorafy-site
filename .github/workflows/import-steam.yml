name: Import Steam catalog

# Runs outside Vercel on purpose: no function time limit, and it avoids the
# 403s that CheapShark returns to Vercel's IPs. See scripts/import-steam.mts.

on:
  schedule:
    - cron: "17 * * * *"     # hourly: up to 4000 due games via GetItems (new first; top 500 refresh every 6h, rest daily)
    - cron: "40 4 * * 1"     # Mondays: re-rank the top 20000 from Steam (store search + charts, by review count)
    - cron: "5 5 * * *"      # daily: add most played / trending, prune games that fell out
  workflow_dispatch:
    inputs:
      command:
        description: "seed | seed-ids | run | discover | run-appdetails | backfill-trailers | art"
        default: run
      arg:
        description: "topN / comma-separated IDs / maxGames / max games to backfill"
        default: ""

concurrency:
  group: import-steam
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run importer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          CMD: ${{ inputs.command }}
          ARG: ${{ inputs.arg }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/import-steam.mts "$CMD" $ARG
          elif [ "${{ github.event.schedule }}" = "40 4 * * 1" ]; then
            node scripts/import-steam.mts seed 20000
          elif [ "${{ github.event.schedule }}" = "5 5 * * *" ]; then
            node scripts/import-steam.mts discover
          else
            node scripts/import-steam.mts run
          fi
