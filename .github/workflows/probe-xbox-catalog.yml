name: Probe Xbox catalog

# Read-only: which official Microsoft source lists the whole Xbox games catalog.
# See scripts/probe-xbox-catalog.mts. Run manually.

on:
  workflow_dispatch:
    inputs:
      section:
        description: "browse | sitemap | igdb (empty = all)"
        default: browse

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Probe
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          SECTION: ${{ inputs.section }}
        run: node scripts/probe-xbox-catalog.mts "$SECTION"
