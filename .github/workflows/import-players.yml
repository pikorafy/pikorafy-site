name: Import Steam player counts

# Concurrent players for every ranked game, hourly. See scripts/import-players.mts.

on:
  schedule:
    - cron: "5 */3 * * *"   # every 3h (was hourly): keeps the free-plan database under its I/O budget
  workflow_dispatch:

concurrency:
  group: import-players
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run importer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/import-players.mts
