name: Import Xbox catalog

# Xbox / Microsoft Store games for /xbox. See scripts/import-xbox.mts.
# Discovery: xbox.com's browse lists (top console and top PC games, most popular first), plus the public
# Game Pass catalogs for tags. Top games are checked every run, the rest once a day;
# only changed products are written.

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6h: refresh prices and pick up new games
  workflow_dispatch:
    inputs:
      per_platform:
        description: "Top games per platform (console, PC) to track"
        default: "500"
      pages:
        description: "OpenXBL pages per list (optional extra source, 0 = off)"
        default: "0"

concurrency:
  group: import-xbox
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run importer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENXBL_API_KEY: ${{ secrets.OPENXBL_API_KEY }}
          PER_PLATFORM: ${{ inputs.per_platform || '500' }}
          PAGES: ${{ inputs.pages || '0' }}
        run: node scripts/import-xbox.mts run "$PER_PLATFORM" "$PAGES"
