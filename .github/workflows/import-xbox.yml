name: Import Xbox catalog

# Xbox / Microsoft Store games for /xbox. See scripts/import-xbox.mts.
# Discovery: Microsoft Store lists + Game Pass catalog (public), plus OpenXBL
# lists (free key: 150 requests/hour; ~12 per run).

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6h: refresh prices and pick up new games
  workflow_dispatch:
    inputs:
      pages:
        description: "OpenXBL pages per list (25 each; extra source)"
        default: "2"
      per_store_list:
        description: "Games per Microsoft Store list (Most played, Top paid, …)"
        default: "400"

concurrency:
  group: import-xbox
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run importer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENXBL_API_KEY: ${{ secrets.OPENXBL_API_KEY }}
          PAGES: ${{ inputs.pages || '2' }}
          PER_LIST: ${{ inputs.per_store_list || '400' }}
        run: node scripts/import-xbox.mts run "$PAGES" "$PER_LIST"
