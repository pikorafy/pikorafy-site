# Supabase's URL layout in front of PostgREST: /rest/v1/<table> → PostgREST /<table>.
server {
  listen 80;
  client_max_body_size 50m;

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }

  location = / {
    return 200 "Pikorafy local API\n";
  }
}
