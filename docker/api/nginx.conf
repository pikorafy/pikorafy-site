# Supabase's URL layout in front of PostgREST: /rest/v1/<table> → PostgREST /<table>.
server {
  listen 80;
  client_max_body_size 50m;
  # Importer requests can be long (in.(…) lists of 500 ids or titles), and PostgREST repeats
  # the query in its Content-Location response header: allow both, like Supabase's gateway.
  large_client_header_buffers 8 128k;

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
    proxy_buffer_size 128k;
    proxy_buffers 16 128k;
    proxy_busy_buffers_size 256k;
  }

  location = / {
    return 200 "Pikorafy local API\n";
  }
}
