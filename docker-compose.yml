# Pikorafy on your own computer: database, API, site and scheduled imports.
#
#   docker compose up -d --build        start everything (site on http://localhost:3033)
#   docker compose logs -f app jobs     follow the site and the importers
#   docker compose down                 stop (the database is kept in the "pgdata" volume)
#
# First time: load the data from Supabase with docker/import-from-supabase.ps1 (see docker/README.md).
#
# Ports on your PC (only reachable from this PC), changeable in a .env file next to this one:
#   site 3033 (PIKORAFY_APP_PORT) · API 3034 (PIKORAFY_API_PORT) · database 5533 (PIKORAFY_DB_PORT)
# Containers, network and volume are all prefixed "pikorafy", so they don't mix with other projects.

name: pikorafy

x-local-api: &local-api
  # Local-only key for the API below (a token signed with PGRST_JWT_SECRET). Not a secret.
  SUPABASE_URL: http://api
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoicGlrb3JhZnktbG9jYWwifQ.drY33MJKfluApzdA0nOg_II092wtHxmjCG0LlIAM40Y

services:
  # PostgreSQL 17, the same major version as the Supabase database the data comes from.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pikorafy
      POSTGRES_DB: pikorafy
    ports:
      - "127.0.0.1:${PIKORAFY_DB_PORT:-5533}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/db:/pikorafy:ro
      - ./docker/backups:/backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "pikorafy"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # PostgREST: the same API Supabase runs in front of its database, so the site and the
  # importers work unchanged (supabase-js). No 8-second statement limit here.
  rest:
    image: postgrest/postgrest:v12.2.12
    environment:
      PGRST_DB_URI: postgres://authenticator:pikorafy@db:5432/pikorafy
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000                # same page size as Supabase
      PGRST_JWT_SECRET: pikorafy-local-dev-only-secret-change-me-0123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Supabase's URL layout (/rest/v1/…) in front of PostgREST. http://localhost:3034 on your PC.
  api:
    image: nginx:alpine
    volumes:
      - ./docker/api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PIKORAFY_API_PORT:-3034}:80"
    depends_on:
      - rest
    restart: unless-stopped

  # The site, built and served in production mode on http://localhost:3033.
  # (For development with live reload, run "npm run dev" on your PC instead; see docker/README.md.)
  app:
    build: .
    environment:
      <<: *local-api
    ports:
      - "127.0.0.1:${PIKORAFY_APP_PORT:-3033}:3033"
    depends_on:
      - api
    restart: unless-stopped

  # Scheduled jobs: the importers on the same schedule as the GitHub Actions, plus the hourly
  # home-page refresh. API keys come from docker/importers.env (see docker/importers.env.example);
  # an importer whose keys are missing is skipped.
  jobs:
    build: .
    command: ["node", "scripts/local/scheduler.mts"]
    environment:
      <<: *local-api
    env_file:
      - path: docker/importers.env
        required: false
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
